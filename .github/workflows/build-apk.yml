name: Build AI Crypto Predictor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Распаковать проект
        run: |
          unzip -q AI_Crypto_Predictor_v2_Android.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Найти Android проект
        id: project
        run: |
          FILE=$(find project \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle settings not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $DIR"

      - name: Собрать APK с повторными попытками
        run: |
          for i in 1 2 3; do
            gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug && exit 0
            echo "Попытка $i не удалась. Ждём 60 секунд..."
            sleep 60
          done
          exit 1

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Crypto-Predictor-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
