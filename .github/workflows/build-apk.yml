name: Build Al chat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q Al-chat-Android-project.zip -d extracted
          test -f extracted/AlChat/settings.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p extracted/AlChat \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-chat-APK
          path: extracted/AlChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
