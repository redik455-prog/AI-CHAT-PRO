- name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "FOOTBALL-PRO-Android-GitHub.zip" ]; then
            mkdir -p extracted
            unzip -o "FOOTBALL-PRO-Android-GitHub.zip" -d extracted
          elif [ -f "FOOTBALL-PRO-Android.zip" ]; then
            mkdir -p extracted
            unzip -o "FOOTBALL-PRO-Android.zip" -d extracted
          fi

          PROJECT_FILE=$(find . \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -not -path "*/.gradle/*" \
            -not -path "*/build/*" \
            -not -path "*/.git/*" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "FOOTBALL PRO project found in: $PROJECT_DIR"
