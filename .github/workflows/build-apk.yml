name: Сборка MATCH AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Распаковать MATCH AI
        run: |
          unzip -q MATCH_AI_Russian_Expanded.zip -d project
          echo "Содержимое архива:"
          find project -maxdepth 3 -type f | head -50

      - name: Найти Android-проект
        id: project
        run: |
          FILE=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle-файлы не найдены в архиве"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Найден проект: $DIR"

      - name: Собрать APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: MATCH-AI-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
