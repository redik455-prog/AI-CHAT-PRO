name: Build Al chat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          set -euxo pipefail
          mkdir -p extracted
          unzip -q "$GITHUB_WORKSPACE/Al-chat-Android-project.zip" -d extracted
          find extracted -maxdepth 5 -name settings.gradle.kts
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")"
          if [ "$PROJECT_DIR" = "." ] || [ -z "$PROJECT_DIR" ]; then
            echo "Не найден settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-chat-APK
          path: output/app-debug.apk
