- name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p project

          if [ -f "AI_Crypto_Predictor_3.0_GitHub_Bundle.zip" ]; then
            unzip -o "AI_Crypto_Predictor_3.0_GitHub_Bundle.zip" -d bundle
          fi

          ZIP=$(find . -type f -name "AI_Crypto_Predictor_3.0_Android.zip" -print -quit)

          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d project
          else
            echo "Не найден ZIP проекта."
            find . -maxdepth 3 -type f | head -80
            exit 1
          fi

          DIR=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -printf '%h\n' | head -1)

          if [ -z "$DIR" ]; then
            echo "Gradle project files not found after extraction."
            find project -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
