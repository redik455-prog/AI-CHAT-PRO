name: Build APK

on:
  push:
    paths:
      - 'Al-chat-Android-project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project archive
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Al-chat-Android-project.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project/AlChatTrader
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-chat-APK
          path: project/AlChatTrader/app/build/outputs/apk/debug/app-debug.apk
