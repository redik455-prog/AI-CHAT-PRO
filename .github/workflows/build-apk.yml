name: Сборка MATCH AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Найти папку Android-проекта
        id: project
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Не найден settings.gradle.kts или settings.gradle"
            echo "Содержимое репозитория:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Проект найден: $DIR"

      - name: Собрать APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: MATCH-AI-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
