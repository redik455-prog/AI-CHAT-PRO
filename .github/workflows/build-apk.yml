name: Build FOOTBALL PRO Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "FOOTBALL-PRO-Android.zip" ]; then
            mkdir -p project
            unzip -o "FOOTBALL-PRO-Android.zip" -d project
            echo "dir=project" >> "$GITHUB_OUTPUT"
          else
            echo "FOOTBALL PRO Android project not found."
            exit 1
          fi

      - name: Verify Android security
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          M="app/src/main/AndroidManifest.xml"
          test -f "$M"
          ! grep -Eq 'READ_CONTACTS|READ_SMS|SEND_SMS|READ_CALL_LOG|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|MANAGE_EXTERNAL_STORAGE|INTERNET' "$M"
          grep -q 'android:usesCleartextTraffic="false"' "$M"
          grep -q 'android:allowBackup="false"' "$M"

      - name: Build APK and run Android Lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug lint

      - name: Upload FOOTBALL PRO APK
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL-PRO-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL-PRO-Lint-Report
          path: ${{ steps.project.outputs.dir }}/app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14
