name: Build FOOTBALL PRO Android

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="FOOTBALL-PRO-Android-GitHub.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "ZIP extracted successfully"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE=$(find extracted \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android project not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FOOTBALL-PRO-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
